<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Меню — Luce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.mh{padding:150px 0 40px;display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end}
.srch{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:14px 20px;min-width:300px}
.srch input{border:0;outline:0;background:none;flex:1;font-size:15px;min-width:0}
.srch svg{width:18px;height:18px;color:var(--muted)}
.tabs{position:sticky;top:80px;z-index:40;background:rgba(244,239,230,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-block:1px solid var(--line)}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:10px 18px;border-radius:999px;font-size:15px;font-weight:500;transition:all .25s}
.tabs a:hover{background:rgba(27,23,18,.06)}
.tabs a.on{background:var(--ink);color:var(--paper)}
.ms{padding:80px 0 0;scroll-margin-top:150px}
.ms .h{display:flex;align-items:baseline;gap:18px;margin-bottom:28px;flex-wrap:wrap}
.ms .h h2{font-family:var(--serif);font-size:clamp(40px,5vw,68px);font-weight:500;line-height:1}
.ms .h span{font-family:var(--serif);font-style:italic;color:var(--terra);font-size:22px}
.fbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:none;justify-content:space-between;align-items:center;background:var(--green);color:var(--paper);border-radius:20px;padding:16px 20px;font-weight:600;box-shadow:0 14px 40px rgba(29,59,47,.4)}
.fbar.show{display:flex}
@media(max-width:900px){.mh{grid-template-columns:1fr;padding-top:120px}.srch{min-width:0}}
</style>
</head>
<body data-page="menu.html">
<main>
  <div class="wrap mh">
    <div><div class="kick">Меню · доставка та самовивіз</div><h1 class="h1">Il <em>menù</em></h1><p class="lead" style="margin-top:16px">Натисніть на страву, щоб обрати розмір, добавки чи міцність. Доставка по центру — 40 хвилин.</p></div>
    <label class="srch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Пошук: карбонара, негроні…" aria-label="Пошук по меню"></label>
  </div>
  <nav class="tabs" aria-label="Категорії"><div class="wrap" id="tabs"></div></nav>
  <div class="wrap" id="secs"></div>
  <button class="fbar" id="fbar"><span id="fbN"></span><span id="fbS"></span></button>
</main>

<script src="assets/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
$('#tabs').innerHTML=CATS.map(([k,v])=>`<a href="#${k}" data-k="${k}">${v}</a>`).join('');
function render(){const q=$('#q').value.trim().toLowerCase();
  $('#secs').innerHTML=CATS.map(([k,v,sub])=>{const l=MENU.filter(m=>m.c===k&&(!q||(m.n+' '+m.d).toLowerCase().includes(q)));if(!l.length)return'';return `<section class="ms" id="${k}"><div class="h"><h2>${v}</h2>${sub?`<span>${sub}</span>`:''}</div><div class="items">${l.map(itemCard).join('')}</div></section>`}).join('')||`<p class="empty" style="padding:100px 0">Нічого не знайшли. Спробуйте «піца» або «тірамісу».</p>`;
  hydrate($('#secs'));obs()}
let so;function obs(){so&&so.disconnect();so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$$('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.k===e.target.id))}),{rootMargin:'-40% 0px -55% 0px'});$$('.ms').forEach(s=>so.observe(s))}
$('#tabs').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();scrollToEl($('#'+a.dataset.k),-150)});
$('#q').oninput=render;
const fb=()=>{const n=cart.reduce((s,x)=>s+x.q,0);$('#fbN').textContent=`${n} у замовленні`;$('#fbS').textContent=`${fmt(cartSum())} →`;$('#fbar').classList.toggle('show',n>0&&innerWidth<900)};
$('#fbar').onclick=()=>openCart(true);document.addEventListener('click',()=>setTimeout(fb,60));
boot();render();fb();
if(location.hash){const t=$(location.hash);if(t)setTimeout(()=>{window.lenis?window.lenis.scrollTo(t,{offset:-150,immediate:true}):t.scrollIntoView()},120)}
</script>
</body>
</html>
