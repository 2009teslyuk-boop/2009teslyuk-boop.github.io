<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Каталог — Just Apple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kaushan+Script&family=Marck+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="catalog.html">
<main>
  <section class="page-head" style="padding-bottom:90px">
    <div class="wrap">
      <nav class="crumbs"><a href="index.html">Головна</a><span>Каталог</span></nav>
      <h2 class="h2" id="ttl">Каталог. <span class="m">Уся техніка Apple в одному місці.</span></h2>
      <div class="tabs" id="tabs"><span class="pill" id="pill"></span></div>
      <div class="cond" id="cond"><button data-c="all">Усі</button><button data-c="new">Нові</button><button data-c="used">Б/у з гарантією</button></div>
      <div class="toolbar">
        <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#86868b" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Пошук: iPhone 18, 256 ГБ…" aria-label="Пошук"></label>
        <select id="sort" aria-label="Сортування"><option value="pop">Спершу популярні</option><option value="asc">Ціна: за зростанням</option><option value="desc">Ціна: за спаданням</option></select>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</main>

<script src="assets/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
let cat=param('cat')||'all',cond=param('cond')||'all';
$('#tabs').insertAdjacentHTML('beforeend',CATS.map(([k,v])=>`<button class="tab" data-c="${k}">${v}</button>`).join(''));
function movePill(){const t=$(`.tab[data-c="${cat}"]`)||$('.tab');$$('.tab').forEach(x=>x.classList.toggle('on',x===t));const p=$('#pill');p.style.left=t.offsetLeft+'px';p.style.width=t.offsetWidth+'px'}
$('#tabs').onclick=e=>{const t=e.target.closest('.tab');if(!t)return;cat=t.dataset.c;sync()};
$('#cond').onclick=e=>{const b=e.target.closest('button');if(!b)return;cond=b.dataset.c;sync()};
$('#q').oninput=render;$('#sort').onchange=render;
function sync(){movePill();$$('#cond button').forEach(b=>b.classList.toggle('on',b.dataset.c===cond));render();
  const u=new URLSearchParams();if(cat!=='all')u.set('cat',cat);if(cond!=='all')u.set('cond',cond);history.replaceState(null,'','catalog.html'+(u.toString()?'?'+u:''));
  $('#ttl').innerHTML=cond==='used'?'Б/у з гарантією. <span class="m">Перевірені пристрої, чесна батарея.</span>':cond==='new'?'Нова техніка. <span class="m">Запечатані коробки.</span>':'Каталог. <span class="m">Уся техніка Apple в одному місці.</span>'}
function render(){const q=$('#q').value.trim().toLowerCase(),s=$('#sort').value;
  let l=P.filter(p=>(cat==='all'||p.cat===cat)&&(cond==='all'||p.cond===cond)&&(!q||(p.n+' '+p.d+' '+p.mem.map(memLabel).join(' ')).toLowerCase().includes(q)));
  l.sort((a,b)=>s==='asc'?a.base-b.base:s==='desc'?b.base-a.base:b.pop-a.pop);
  $('#grid').innerHTML=l.length?l.map(card).join(''):`<div class="empty">Зараз немає в наявності. <a class="link" href="${DM}" target="_blank" rel="noopener" style="color:var(--accent)">Напишіть нам</a> — привеземо під замовлення.</div>`}
boot();sync();addEventListener('resize',movePill);
</script>
</body>
</html>
